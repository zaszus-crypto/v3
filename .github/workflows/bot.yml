name: XAUUSD Signal Bot

on:
  schedule:
    # Setiap 30 menit pada menit ke-2 (hindari tabrakan dengan cron lain)
    - cron: '2,32 * * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Job type'
        required: true
        default: 'signal'
        type: choice
        options:
          - signal
          - backtest
          - diagnostic
          - retrain_ml

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Restore state cache
        uses: actions/cache@v4
        with:
          path: state
          key: bot-state-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            bot-state-${{ github.ref }}-
            bot-state-

      - name: Prepare state dir
        run: mkdir -p state

      - name: Retrain ML (opsional)
        if: github.event.inputs.job == 'retrain_ml'
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_DIR: state
        run: python ml_engine.py

      - name: Run signal bot
        if: github.event.inputs.job == 'signal' || github.event.inputs.job == ''
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_DIR: state
        run: python main.py

      - name: Run backtest
        if: github.event.inputs.job == 'backtest'
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_DIR: state
        run: python backtest.py

      - name: Run diagnostic
        if: github.event.inputs.job == 'diagnostic'
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_DIR: state
        run: python diagnostic.py

      - name: Upload state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-${{ github.run_number }}
          path: state/
          retention-days: 14
          if-no-files-found: ignore
