name: ORB Gold Bot

on:
  schedule:
    - cron: '*/15 13-20 * * 1-4'      # Setiap 15 menit, jam 13-20 UTC, Senin-Kamis
    - cron: '0 14-20 * * 5'            # Jumat hanya cek (optional)
  workflow_dispatch:
    inputs:
      job:
        description: 'Job'
        required: true
        default: 'signal'
        type: choice
        options: [signal, backtest]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: state
          key: orb-state-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            orb-state-${{ github.ref }}-
            orb-state-

      - run: mkdir -p state

      - name: Run signal
        if: github.event.inputs.job == 'signal' || github.event.inputs.job == ''
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_DIR: state
        run: python main.py

      - name: Run backtest
        if: github.event.inputs.job == 'backtest'
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_DIR: state
        run: python backtest.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: state-${{ github.run_number }}
          path: state/
          retention-days: 14
          if-no-files-found: ignore
